# Увесь стек на одній машині (бекенд + nginx-фронт). За замовчуванням — лише docker-compose.yml (сервер).
services:
  frontend:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
