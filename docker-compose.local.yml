# Локальний тест: docker compose -f docker-compose.local.yml up --build
services:
  app:
    build: .
    ports:
      - "8001:8000"
    environment:
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: llama3.2:1b
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-600}
      LLM_CONNECT_TIMEOUT: ${LLM_CONNECT_TIMEOUT:-120}
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 10g
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s

volumes:
  ollama_data:
