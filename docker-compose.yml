services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: 1
    mem_limit: 8g
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "8000:8000"

  # Одноразово: docker compose --profile init run --rm ollama-init
  ollama-init:
    profiles: ["init"]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hermes3}
    volumes:
      - ./docker/pull-model.sh:/pull-model.sh:ro
    entrypoint: ["/bin/sh", "/pull-model.sh"]
    restart: "no"

  api:
    build: .
    network_mode: "service:ollama"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hermes3}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-600}
      LLM_CONNECT_TIMEOUT: ${LLM_CONNECT_TIMEOUT:-120}
    mem_limit: 1g
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  ollama_data:
